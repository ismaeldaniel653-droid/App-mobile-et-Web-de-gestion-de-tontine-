services:
  base_de_donnees:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vakoa}
      POSTGRES_USER: ${POSTGRES_USER:-vakoa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mot-de-passe-local-a-remplacer}
    ports:
      - "5432:5432"
    volumes:
      - donnees_postgresql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vakoa} -d ${POSTGRES_DB:-vakoa}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - donnees_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  donnees_postgresql:
  donnees_redis: